name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm tsc

      - run: pnpm lint

      # `pnpm build` is deliberately not run here: generateStaticParams and
      # app/sitemap.ts hit the live Supabase project at build time (see
      # AGENTS.md's rendering-mode table), which would need production
      # secrets in CI. tsc + lint are what's checked until that's set up.
